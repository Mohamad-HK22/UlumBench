[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulumbench"
version = "1.0.0"
description = "Evaluate new language models on UlumBench academic and multi-step tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "UlumBench contributors"}]
dependencies = ["huggingface-hub>=0.26,<2", "requests>=2.32,<3", "filelock>=3.16,<4", "numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.urls]
Homepage = "https://ulumbench.com"
Repository = "https://github.com/Mohamad-HK22/UlumBench"
Dataset = "https://huggingface.co/datasets/MHK-22/UlumBench"
Paper = "https://openreview.net/forum?id=XwNQ9m9mem"

[project.scripts]
ulumbench = "ulumbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ulumbench = ["dataset.json", "scoring/units.json"]
